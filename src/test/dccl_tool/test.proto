syntax = "proto2";
import "dccl/option_extensions.proto";

package dccl.test;

message CommandMsg
{
    option (dccl.msg).id = 124;
    option (dccl.msg).max_bytes = 32;
    option (dccl.msg).codec_version = 5;

    required int32 destination = 1 [
        (dccl.field).min = 0,
        (dccl.field).max = 31
    ];
    optional double speed = 2 [
        (dccl.field).min = 0,
        (dccl.field).max = 10,
        (dccl.field).precision = 1
    ];
    optional string comment = 3 [(dccl.field).max_length = 8];
    optional bool active = 4;
}

message StatusMsg
{
    option (dccl.msg).id = 125;
    option (dccl.msg).max_bytes = 16;
    option (dccl.msg).codec_version = 5;

    enum State
    {
        IDLE = 1;
        RUNNING = 2;
    }

    required State state = 1;
    optional int32 count = 2 [
        (dccl.field).min = 0,
        (dccl.field).max = 1000
    ];
}

// Deliberately not a DCCL message: exercises the tool's "not a valid DCCL
// message" path when a whole .proto file is loaded with -f.
message NotDcclMsg
{
    optional int32 whatever = 1;
}
