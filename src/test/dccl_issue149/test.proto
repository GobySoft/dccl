// Test messages for issue #149: min/max limits of floating point fields are not always inclusive
// https://github.com/GobySoft/dccl/issues/149

syntax = "proto2";
import "dccl/option_extensions.proto";
package dccl.test;

// v4 codec message from issue #149 - encoding at the max boundary (0.05) fails in v4
message Issue149V4Msg
{
    option (dccl.msg).id = 149;
    option (dccl.msg).max_bytes = 4;
    option (dccl.msg).codec_version = 4;

    optional float a = 1 [
        (dccl.field).min = 0,
        (dccl.field).max = 0.05,
        (dccl.field).precision = 2
    ];
}

// v5 codec message with the same field definition - encoding at the max boundary should succeed
message Issue149V5Msg
{
    option (dccl.msg).id = 150;
    option (dccl.msg).max_bytes = 4;
    option (dccl.msg).codec_version = 5;

    optional float a = 1 [
        (dccl.field).min = 0,
        (dccl.field).max = 0.05,
        (dccl.field).precision = 2
    ];
}
