syntax = "proto2";
import "dccl/option_extensions.proto";

package dccl.test.plugin;

// Covers (dccl.field).udunits. udunits_test.cpp checks the generated accessors.
message UdunitsMsg
{
    option (dccl.msg).id = 234;
    option (dccl.msg).max_bytes = 64;
    option (dccl.msg).codec_version = 4;

    optional double speed = 1 [(dccl.field).udunits = "knot"];
    optional double velocity = 2 [(dccl.field).udunits = "m s-1"];
    optional double bearing = 3 [(dccl.field).udunits = "°"];
    // the arc second's symbol is a double quote
    optional double bearing_error = 4 [(dccl.field).udunits = "\""];
    optional double temperature = 5 [(dccl.field).udunits = "degC"];
    optional int32 depth_cm = 6 [(dccl.field).udunits = "cm"];
    optional int32 altitude_m = 9 [(dccl.field).udunits = "m"];
    repeated float depths = 7 [(dccl.field).udunits = "m"];
    // a field without units gets no unit string
    optional double plain = 8;
}
