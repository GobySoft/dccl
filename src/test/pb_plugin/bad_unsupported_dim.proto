syntax = "proto2";
import "dccl/option_extensions.proto";

package dccl.test.plugin;

// A dimension the specialised system does not support. Note this uses
// derived_dimensions: pb_plugin only calls validate_dimensions_for_system()
// on that path, so the same mismatch expressed as base_dimensions is not
// checked at all and silently generates the wrong unit.
message BadUnsupportedDimMsg
{
    optional double l = 1 [(dccl.field) = {
        units { derived_dimensions: "length" system: "degree" }
    }];
}
