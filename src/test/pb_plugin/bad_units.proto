syntax = "proto2";
import "dccl/option_extensions.proto";

package dccl.test.plugin;

// Units on a string field. The generator emits boost::units quantities over
// the field's own type, so a non-numeric field must be rejected rather than
// producing a header that cannot compile.
message BadUnitsMsg
{
    option (dccl.msg).id = 232;
    option (dccl.msg).max_bytes = 32;
    option (dccl.msg).codec_version = 5;
    option (dccl.msg).unit_system = "si";

    required string name = 1 [
        (dccl.field).units.base_dimensions = "L",
        (dccl.field).max_length = 8
    ];
}
