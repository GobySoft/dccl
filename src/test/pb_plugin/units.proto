syntax = "proto2";
import "dccl/option_extensions.proto";

package dccl.test.plugin;

// Covers each way of naming units that the generator understands.
message UnitsMsg
{
    option (dccl.msg).id = 230;
    option (dccl.msg).max_bytes = 64;
    option (dccl.msg).codec_version = 5;
    option (dccl.msg).unit_system = "si";

    required double distance = 1 [
        (dccl.field).units.base_dimensions = "L",
        (dccl.field).min = 0,
        (dccl.field).max = 1000
    ];

    required double speed = 2 [
        (dccl.field).units.derived_dimensions = "velocity",
        (dccl.field).min = 0,
        (dccl.field).max = 100
    ];

    // an integer field, and a prefixed unit
    required int32 depth = 3 [(dccl.field) = {
        units { derived_dimensions: "length" prefix: "kilo" }
        min: 0
        max: 100
    }];

    // absolute vs. relative temperature take different code paths
    required double temperature = 4 [(dccl.field) = {
        units { base_dimensions: "K" relative_temperature: true }
        min: 0
        max: 30
        precision: 1
    }];

    // a unit supplied by a hand-written header rather than a dimension string
    required int32 conductivity = 5 [(dccl.field) = {
        units {
            custom {
                unit: "dccl::units::microsiemens_per_cm_unit"
                header: "dccl/units/conductivity.h"
            }
        }
        min: 40000
        max: 60000
    }];

    // dimensionless
    required double salinity = 6 [
        (dccl.field).units.base_dimensions = "-",
        (dccl.field).min = 0,
        (dccl.field).max = 40
    ];

    // a field with no units at all must still generate normally
    required int32 plain = 7 [
        (dccl.field).min = 0,
        (dccl.field).max = 10
    ];
}

// A per-field system overriding the message-level one.
message FieldSystemMsg
{
    option (dccl.msg).id = 231;
    option (dccl.msg).max_bytes = 32;
    option (dccl.msg).codec_version = 5;

    required double angle = 1 [(dccl.field) = {
        units { derived_dimensions: "plane_angle" system: "degree" }
        min: 0
        max: 360
        precision: 1
    }];
}
