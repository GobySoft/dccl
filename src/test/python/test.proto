syntax = "proto2";
import "dccl/option_extensions.proto";

package dccl.test.python;

message NormalMsg
{
    option (dccl.msg).id = 201;
    option (dccl.msg).max_bytes = 32;
    option (dccl.msg).codec_version = 5;

    required double d = 1 [
        (dccl.field).min = -100,
        (dccl.field).max = 100,
        (dccl.field).precision = 2
    ];
    optional int32 i = 2 [(dccl.field).min = -20, (dccl.field).max = 3000];
}

// A second normal message with a different ID to exercise mismatched-ID error
// handling in decode_with_full_name.
message AnotherMsg
{
    option (dccl.msg).id = 202;
    option (dccl.msg).max_bytes = 32;
    option (dccl.msg).codec_version = 5;

    required float f = 1 [
        (dccl.field).min = -10,
        (dccl.field).max = 10,
        (dccl.field).precision = 1
    ];
}

message OmitIdMsg
{
    option (dccl.msg).omit_id = true;
    option (dccl.msg).max_bytes = 32;
    option (dccl.msg).codec_version = 5;

    required double d = 1 [
        (dccl.field).min = -100,
        (dccl.field).max = 100,
        (dccl.field).precision = 2
    ];
    optional int32 i = 2 [(dccl.field).min = -20, (dccl.field).max = 3000];
}
