syntax = "proto2";
import "dccl/option_extensions.proto";

package dccl.test.udunits;

// Fields with (dccl.field).udunits, converted at run time.
message RuntimeMsg
{
    option (dccl.msg) = {
        id: 124
        max_bytes: 64
        codec_version: 4
    };

    optional double speed = 1
        [(dccl.field) = { udunits: "knot" min: 0 max: 20 resolution: 0.1 }];
    optional int32 depth = 2
        [(dccl.field) = { udunits: "ft" min: 0 max: 20000 }];
    optional float heading = 3
        [(dccl.field) = { udunits: "degree" min: 0 max: 360 resolution: 0.1 }];
    optional double water_temperature = 4
        [(dccl.field) = { udunits: "degC" min: -5 max: 40 resolution: 0.01 }];
    repeated double sonar_ranges = 5 [(dccl.field) = {
        udunits: "m"
        min: 0
        max: 100
        resolution: 0.1
        max_repeat: 3
    }];
    optional uint64 storage = 6
        [(dccl.field) = { udunits: "kilobyte" min: 0 max: 1000000 }];
    optional double plain = 7 [(dccl.field) = { min: 0 max: 10 }];
    optional string name = 8 [(dccl.field).max_length = 10];
}
