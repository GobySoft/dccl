syntax = "proto3";
import "dccl/option_extensions.proto";
package dccl.test;

message Child
{
    double req_dbl = 1 [(dccl.field) = { min: -1, max: 1, resolution: 0.1 }];
}

message Proto3Msg
{
    option (dccl.msg).id = 10;
    option (dccl.msg).max_bytes = 32;
    option (dccl.msg).codec_version = 5;

    // treated as proto2 "required" fields
    int32 req_i32 = 1 [(dccl.field) = { min: -100, max: 500 }];
    uint32 req_ui32 = 2 [(dccl.field) = { min: 10, max: 1022 }];

    // In proto3, the `optional` keyword enables field presence tracking
    // via a synthetic `oneof`
    optional int32 opt_i32 = 3 [(dccl.field) = { min: -100, max: 500 }];
    optional uint32 opt_ui32 = 4 [(dccl.field) = { min: 0, max: 1022 }];

    Child child = 5;
}
