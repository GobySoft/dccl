// Tests proto3 syntax support: uses (dccl.field).required = true to mark
// fields that should be encoded without a presence bit (replacing proto2's
// `required` label which does not exist in proto3).

syntax = "proto3";
import "dccl/option_extensions.proto";
package dccl.test;

message Proto3Msg
{
    option (dccl.msg).id = 10;
    option (dccl.msg).max_bytes = 32;
    option (dccl.msg).codec_version = 4;
    option (dccl.msg).codec_group = "dccl.presence";

    // Use (dccl.field).required = true to request DCCL-required encoding
    // (no presence bit) for these fields, matching proto2 `required` semantics.
    int32 req_i32 = 1 [(dccl.field) = { required: true, min: -100, max: 500 }];
    uint32 req_ui32 = 2 [(dccl.field) = { required: true, min: 0, max: 1022 }];

    // These fields are DCCL-optional (presence bit used). In proto3, the
    // `optional` keyword enables field presence tracking.
    optional int32 opt_i32 = 3 [(dccl.field) = { min: -100, max: 500 }];
    optional uint32 opt_ui32 = 4 [(dccl.field) = { min: 0, max: 1022 }];

    // Proto3 field with no presence tracking and no (dccl.field).required = true.
    // The field always has a value (defaulting to 0 if unset); DCCL encodes it
    // with a presence bit that is always 1, since the value is never "empty".
    int32 opt_i32_pb3 = 5 [(dccl.field) = { min: -100, max: 500 }];
}
